[project]
name = "machines"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "micropython-rp2-rpi_pico2_w-stubs~=1.29.0",
    "mpremote>=1.29.0",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
pythonPlatform = "Linux"
# MicroPython syntax compatibility, independent of the host Python version.
pythonVersion = "3.8"
reportMissingModuleSource = "none"
reportUnnecessaryTypeIgnoreComment = "information"

[tool.ruff]
line-length = 90
target-version = "py38"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "E501"]

[tool.pytest.ini_options]
testpaths = ["projects"]
addopts = ["--import-mode=importlib"]
